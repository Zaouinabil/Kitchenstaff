spring.config.import=optional:file:./.local/kitchenstaff.properties
spring.application.name=kitchenstaff-api

server.port=8080

# Database configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# Resolve the local environment-style setting explicitly; never update the schema by default.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# API
app.api.version=v1
# Opt-in only on a dedicated demonstration database.
app.demo.seed=${DEMO_SEED:false}
app.demo.password=${DEMO_PASSWORD:}

# Hosted Checkout is test-only and opt-in. Never use live credentials.
app.stripe.enabled=${STRIPE_ENABLED:false}
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=whsec_FOPj5QSIoYw8f588aaIKGszLGlH4eZMo 
app.stripe.public-url=${APP_PUBLIC_URL:http://localhost:4200}
# Temporary opt-in for ONE rejected attempt verified in Stripe; remove after recovery.
app.stripe.recover-rejected-attempt=${STRIPE_RECOVER_REJECTED_ATTEMPT:}
