spring.config.import=optional:file:./.local/kitchenstaff.properties
spring.application.name=kitchenstaff-api

server.port=8080

# Database configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# API
app.api.version=v1
# Opt-in only on a dedicated demonstration database.
app.demo.seed=${DEMO_SEED:false}
app.demo.password=${DEMO_PASSWORD:}
